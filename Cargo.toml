[package]
edition      = "2024"
name         = "esp-csi-litegui-rs"
rust-version = "1.88"
version      = "0.2.0"
description  = "No-std CSI heatmap GUI firmware for ESP32 boards with AMOLED displays"
license      = "Apache-2.0"
repository   = "https://github.com/csi-rs/esp-csi-litegui-rs"
readme       = "README.md"
keywords     = ["esp32", "wifi", "csi", "embedded", "no-std"]
categories   = ["embedded", "no-std"]

[features]
default = ["no-std", "println", "auto", "mode-snf"]
## Build without the standard library.
no-std = []
## Enable logging via `println!()`.
println = ["esp-csi-rs/println", "esp-backtrace/println"]
## Select the logging backend at runtime: async drain when USB SOF indicates
## USB-Serial-JTAG is active, sync inline logging on the UART path.
## `async-print` overrides this and forces async logging.
auto = ["esp-csi-rs/auto"]

## Debugging Features
## Force non-blocking async logging regardless of runtime backend detection.
## (No longer implied by `jtag-serial` as of esp-csi-rs 0.8.)
async-print = ["esp-csi-rs/async-print"]
## Enable logging via defmt. esp-csi-rs 0.8 registers its own rzcobs-encoded
## defmt global logger (it no longer enables `esp-println/defmt-espflash`).
defmt = [
    "esp-csi-rs/defmt",
    "esp-backtrace/defmt",
]
## Use an external defmt global logger instead of the one esp-csi-rs registers.
external-defmt-logger = ["esp-csi-rs/external-defmt-logger"]
## Force the JTAG transport for logging. With `auto`, the async drain is still
## selected at runtime; add `async-print` to force it.
jtag-serial = ["esp-csi-rs/jtag-serial"]
## Force the UART backend for logging (not recommended, much slower than JTAG backend).
## Do not combine with `async-print`.
uart = ["esp-csi-rs/uart"]

## Support for the Lilygo T4
lilygo-t4 = [
    "esp-csi-rs/esp32s3",
    "rm690b0-rs/lilygo_t4_s3"
]

## Support for Waveshare ESP32-S3-Touch-AMOLED-1.8
waveshare-esp32-s3-touch-amoled-1_8 = [
    "esp-csi-rs/esp32s3",
    "dep:ft3x68-rs",
    "rm690b0-rs/lilygo_t4_s3"
]

## CSI operation mode feature flags
## Default mode is `mode-snf`.
## You can safely override it by adding `mode-sta` or `mode-ap`
## (without disabling default features).
## Only one override mode may be enabled at a time.
mode-sta = []
mode-snf = []
## SoftAP CSI collector: this board runs an AP + DHCP server and an ICMP flood;
## CSI is captured from the associated station's uplink frames.
mode-ap = []
## Fast one-to-one ESP-NOW collector: RX-only capture of a peer
## `esp_now_fast_source`'s forced-MCS7 unicast flood.

[dependencies]
esp-bootloader-esp-idf = "0.5.0"
esp-backtrace = { version = "0.19.0", features = [
    "panic-handler",
] }
esp-hal = { version = "~1.1", default-features = false, features = [
    "unstable",
] }
esp-rtos = { version = "0.3.0", optional = false, features = [
    "embassy",
    "esp-alloc",
    "esp-radio",
] }
esp-println = { version = "0.17.0", default-features = false }
esp-alloc = { version = "0.10.0" }
esp-radio = { version = "0.18.0", default-features = false, optional = false, features = [
    "wifi",
    "sniffer",
    "esp-alloc",
    "unstable",
    "esp-now",
    "csi",
] }
embassy-executor = { version = "0.10.0" }
embassy-time = { version = "0.5.0" }
static_cell = { version = "2.1.1" }
embassy-sync = { version = "0.8.0" }
esp-sync = { version = "0.2.1" }
embassy-futures = { version = "0.1.2" }
esp-csi-rs = { version = "0.9", default-features = false }
# Required by esp-csi-rs's `log_ln!` macro: its async-logging arm expands to a
# bare `log::info!`, which resolves in the calling crate.
log = "0.4.29"
micromath = "2.1.0"
rm690b0-rs = { version = "0.1.3" }
embedded-graphics = "0.8.2"
profont = "0.7.0"
cst226-rs = { version = "0.1.2" }
ft3x68-rs = { version = "0.1.2", optional = true }
embedded-hal = "1.0.0"

[profile.dev]
# Keep dev reasonably fast to iterate, but avoid extremely slow unoptimized firmware.
incremental = true
debug = 1
opt-level = 2
overflow-checks = false

[profile.dev.package."*"]
# Dependencies (HAL, radio, graphics, etc.) are performance critical.
opt-level = 3

[profile.release]
codegen-units = 1        # LLVM can perform better optimizations using a single thread
debug-assertions = false
incremental = false
lto = 'fat'
# Optimize for speed instead of size.
opt-level = 3
overflow-checks = false
panic = "abort"

[profile.release.package."*"]
opt-level = 3
# The emitter/collector API is not on crates.io yet. Remove once
# esp-csi-rs 0.10 / esp-csi-rs-core 0.2 are published.
[patch.crates-io]
esp-csi-rs = { git = "https://github.com/csi-rs/esp-csi-rs.git", branch = "feat/emitter-collector" }
esp-csi-rs-core = { git = "https://github.com/csi-rs/esp-csi-rs-core.git", branch = "feat/emitter-collector" }
