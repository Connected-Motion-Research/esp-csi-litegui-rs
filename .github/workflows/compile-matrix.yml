name: Compile Matrix (ESP32-S3)

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-check:
    name: ${{ matrix.board }} / ${{ matrix.mode }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board:
          - lilygo-t4
          - waveshare-esp32-s3-touch-amoled-1_8
        mode:
          - mode-now
          - mode-sta
          - mode-snf

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo registry + git + target
        if: ${{ env.ACT != 'true' }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ matrix.board }}-${{ matrix.mode }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-cargo-

      - name: Ensure Rust toolchain is available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v cargo >/dev/null 2>&1; then
            curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install espup
        shell: bash
        run: cargo +stable install espup --locked

      - name: Install ESP toolchain
        shell: bash
        run: espup install --targets esp32s3 --export-file "$HOME/export-esp.sh"

      - name: Compile check
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/export-esp.sh"
          cargo check \
            --release \
            --locked \
            --features "${{ matrix.board }},${{ matrix.mode }}"
